name: Calculadora CI with Maven

# Cambiamos el evento de push a pull_request
on:
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: calculator-tdd
    strategy:
      matrix:
        java: [ '17', '21' ]
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4
      - name: Configurar el JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
      - name: Compilar y empaquetar con Maven
        run: mvn clean package
      - name: Guardar la Calculadora compilada
        uses: actions/upload-artifact@v4
        with:
          name: calculadora-app-java${{ matrix.java }}
          path: calculator-tdd/target/*.jar