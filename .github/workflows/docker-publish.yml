name: Publicar en DockerHub

# Se ejecuta cuando se cierra un pull request hacia main
on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  publish:
    # Solo continua si el PR se ha fusionado (merge)
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el codigo del repositorio
        uses: actions/checkout@v4

      - name: Login en DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v6
        with:
          context: ./calculator-tdd
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/calculator-tdd:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/calculator-tdd:${{ github.sha }}
